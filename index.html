
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Music Hub</title>

  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      padding: 28px 16px;
      background: #101114;
      color: #f5f5f5;
      font-family: Arial, sans-serif;
    }

    main {
      max-width: 850px;
      margin: auto;
    }

    h1 { margin-bottom: 8px; }

    .muted { color: #a5a5ad; }

    form {
      display: flex;
      gap: 8px;
      margin: 24px 0 12px;
    }

    input, button {
      padding: 13px;
      border-radius: 9px;
      font-size: 15px;
    }

    input {
      flex: 1;
      min-width: 0;
      background: #22242a;
      color: white;
      border: 1px solid #41434b;
    }

    button {
      border: 0;
      cursor: pointer;
      font-weight: bold;
    }

    form button {
      background: #72e0a1;
      color: #101114;
    }

    #status { min-height: 24px; }

    .results {
      display: grid;
      gap: 10px;
      margin: 20px 0;
    }

    .song {
      display: flex;
      gap: 12px;
      align-items: center;
      background: #202127;
      padding: 10px;
      border-radius: 10px;
    }

    .song img {
      width: 120px;
      aspect-ratio: 16 / 9;
      object-fit: cover;
      border-radius: 6px;
    }

    .song-info { flex: 1; min-width: 0; }

    .song-title {
      font-weight: bold;
      overflow-wrap: anywhere;
    }

    .song button {
      background: #343740;
      color: white;
      margin-top: 8px;
    }

    #player iframe {
      display: block;
      width: 100%;
      aspect-ratio: 16 / 9;
      border: 0;
      border-radius: 12px;
    }

    .section-title { margin-top: 28px; }

    @media (max-width: 480px) {
      .song img { width: 95px; }
      form { flex-wrap: wrap; }
      form input { flex-basis: 100%; }
    }
  </style>
</head>

<body>
<main>
  <h1>🎵 Music Hub</h1>
  <p class="muted">
    Search songs and play them without leaving this page.
  </p>

  <form id="searchForm">
    <input
      id="query"
      type="search"
      placeholder="Search a song or artist..."
      required
    >
    <button type="submit">Search</button>
  </form>

  <p id="status" class="muted" role="status">
    Search for your first song.
  </p>

  <div id="results" class="results"></div>

  <h2 class="section-title">Now Playing</h2>
  <p id="nowPlaying" class="muted">
    Select a song from the results.
  </p>
  <div id="player"></div>
</main>

<script>
  // Replace with your restricted YouTube Data API key.
  const API_KEY = "AIzaSyCNwm-90UT8IW2ju6MtBOouE9ISJkwF8PY";

  const form = document.getElementById("searchForm");
  const queryInput = document.getElementById("query");
  const resultsBox = document.getElementById("results");
  const statusBox = document.getElementById("status");
  const playerBox = document.getElementById("player");
  const nowPlaying = document.getElementById("nowPlaying");

  form.addEventListener("submit", async (event) => {
    event.preventDefault();

    const query = queryInput.value.trim();
    if (!query) return;

    resultsBox.replaceChildren();
    statusBox.textContent = "Searching...";
    
    try {
      const params = new URLSearchParams({
        part: "snippet",
        type: "video",
        videoEmbeddable: "true",
        q: query,
        maxResults: "10",
        key: API_KEY
      });

      const response = await fetch(
        "https://www.googleapis.com/youtube/v3/search?" +
        params.toString()
      );

      const data = await response.json();

      if (!response.ok) {
        throw new Error(
          data.error?.message || "Search failed."
        );
      }

      if (!data.items || data.items.length === 0) {
        statusBox.textContent = "No results found.";
        return;
      }

      statusBox.textContent =
        `Found ${data.items.length} results.`;

      data.items.forEach((item) => {
        const videoId = item.id.videoId;
        const title = item.snippet.title;
        const channel = item.snippet.channelTitle;
        const thumbnail =
          item.snippet.thumbnails.medium?.url;

        const card = document.createElement("article");
        card.className = "song";

        const img = document.createElement("img");
        img.src = thumbnail || "";
        img.alt = "";
        img.loading = "lazy";

        const info = document.createElement("div");
        info.className = "song-info";

        const songTitle = document.createElement("div");
        songTitle.className = "song-title";
        songTitle.textContent = title;

        const artist = document.createElement("div");
        artist.className = "muted";
        artist.textContent = channel;

        const playButton = document.createElement("button");
        playButton.textContent = "▶ Play here";

        playButton.addEventListener("click", () => {
          playerBox.replaceChildren();

          const iframe = document.createElement("iframe");
          iframe.src =
            "https://www.youtube-nocookie.com/embed/" +
            encodeURIComponent(videoId);

          iframe.title = "YouTube music player";
          iframe.allow =
            "encrypted-media; picture-in-picture";
          iframe.allowFullscreen = true;
          iframe.referrerPolicy =
            "strict-origin-when-cross-origin";

          playerBox.appendChild(iframe);
          nowPlaying.textContent = title + " · " + channel;
        });

        info.append(songTitle, artist, playButton);
        card.append(img, info);
        resultsBox.appendChild(card);
      });

    } catch (error) {
      statusBox.textContent =
        "Error: " + error.message +
        " Check your API key, restrictions and quota.";
    }
  });
</script>
</body>
</html>
